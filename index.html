<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spacelee Stephens • Product Management Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" type="image/png" href="assets/favicon.png">

  <style>
    /* ---------- Global ---------- */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #fafafa;
      color: #222;
      line-height: 1.6;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
      transition: background 0.3s ease, color 0.3s ease, max-width 0.3s ease;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }
    }

    /* ---------- Headings ---------- */
    h1, h2, h3 {
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111;
      transition: color 0.3s ease;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.2rem;
    }

    h2 {
      margin-top: 2.2rem;
      border-bottom: 2px solid #eee;
      padding-bottom: 4px;
      font-size: 1.4rem;
    }

    h3 {
      margin-top: 1.6rem;
      font-size: 1.15rem;
    }

    /* ---------- Subheading ---------- */
    .subtitle {
      font-size: 1rem;
      color: #555;
      margin-bottom: 1.2rem;
    }

    /* ---------- Links ---------- */
    a {
      color: #0057ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ---------- Sections ---------- */
    section {
      margin-bottom: 2.4rem;
    }

    /* ---------- Feature Box ---------- */
    .feature-box {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      margin: 24px 0;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .feature-box h3 {
      margin-top: 0;
    }

    /* ---------- Lists ---------- */
    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 0.9rem;
      color: #666;
      text-align: center;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    /* ---------- Label ---------- */

      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
